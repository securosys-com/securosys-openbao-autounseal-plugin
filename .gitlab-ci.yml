image: golang:1.25

stages:
  - src
  - mirror

src:
  stage: src
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main"
  tags:
    - Go
  script:
    - mkdir -p build
    - go build -o build/openbao-plugin-securosyshsm .
    - sha256sum build/openbao-plugin-securosyshsm > build/openbao-plugin-securosyshsm.sha256
  artifacts:
    paths:
      - build/openbao-plugin-securosyshsm
      - build/openbao-plugin-securosyshsm.sha256

mirror:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  stage: mirror
  tags:
    - Go
  script:
    - git fetch --tags origin
    - git remote remove github || true
    - git remote add github "https://x-access-token:${GH_TOKEN}@github.com/securosys-com/securosys-openbao-autounseal-plugin.git"
    - git push github refs/remotes/origin/main:refs/heads/main --force

mirror_tag:
  rules:
    - if: $CI_COMMIT_TAG
  stage: mirror
  tags:
    - Go
  script:
    - git fetch --tags origin
    - git remote remove github || true
    - git remote add github "https://x-access-token:${GH_TOKEN}@github.com/securosys-com/securosys-openbao-autounseal-plugin.git"
    - git push github "refs/tags/${CI_COMMIT_TAG}:refs/tags/${CI_COMMIT_TAG}"
